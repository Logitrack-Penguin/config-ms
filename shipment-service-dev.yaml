server:
  port: 8080

spring:
  application:
    name: shipment-service
  datasource:
    url: "jdbc:mysql://shipment-database:3306/shipment_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: "${MYSQL_USER:admin_logitrack}"
    password: "${DB_PASSWORD:12345}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"

logging:
  level:
    root: INFO
    ar.edu.unju.fi.arquitecturas.logitrack.shipmentservice: DEBUG