server:
  port: 8080

spring:
  application:
    name: shipment-service
  datasource:
    url: "jdbc:mysql://shipment-database:3306/shipment_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: "${MYSQL_USER:admin_logitrack}"
    password: "${DB_PASSWORD:12345}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"

  # RabbitMQ (LT4-34): shipment consume los eventos de baja de repartidores de courier.
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false   # un mensaje fallido NO vuelve a la cola: va a la DLQ
        retry:
          enabled: true
          max-attempts: 4                 # 1 intento + 3 reintentos
          initial-interval: 1s            # esperas: 1s, 2s, 4s
          multiplier: 2

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true                # sin esto el fallback se ignora
      client:
        config:
          courier-service:
            connect-timeout: 2000    # ms
            read-timeout: 3000       # ms: nunca esperar indefinidamente

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10                  # evalúa las últimas 10 llamadas
        minimum-number-of-calls: 5
        failure-rate-threshold: 50               # si falla el 50% → abre el circuito
        wait-duration-in-open-state: 15s         # tiempo sin llamar a courier
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - ar.edu.unju.fi.arquitecturas.logitrack.shipmentservice.exception.CourierNoEncontradoException
  timelimiter:
    configs:
      default:
        timeout-duration: 4s
logging:
  level:
    root: INFO
    ar.edu.unju.fi.arquitecturas.logitrack.shipmentservice: DEBUG

# Interruptor de la mensajería (LT4-34). Apagado por defecto: el docker-compose lo prende con
# MESSAGING_ENABLED=true junto con el contenedor de RabbitMQ. Con false, el servicio funciona igual
# que antes (no se crea la cola ni el consumidor).
logitrack:
  messaging:
    enabled: ${MESSAGING_ENABLED:false}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8065/eureka/}
  instance:
    prefer-ip-address: true