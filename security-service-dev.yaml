server:
  port: "${SERVER_PORT:8081}"

spring:
  application:
    name: security-service
  datasource:
    url: "jdbc:mysql://security-database:3306/security_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: "${MYSQL_USER:admin_logitrack}"
    password: "${DB_PASSWORD:12345}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"

logitrack:
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: "${JWT_EXPIRATION_MS:3600000}"
    issuer: "${JWT_ISSUER:logitrack-security-service}"
  bootstrap-admin:
    username: "${ADMIN_USERNAME:}"
    password: "${ADMIN_PASSWORD:}"
    email: "${ADMIN_EMAIL:admin@logitrack.local}"

springdoc:
  swagger-ui:
    path: "${SWAGGER_PATH:/swagger-ui.html}"

logging:
  level:
    root: INFO
    ar.edu.unju.fi.arquitecturas.logitrack.securityservice: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8065/eureka/}
  instance:
    prefer-ip-address: true